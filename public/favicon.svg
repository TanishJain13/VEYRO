<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="veyro-border-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B7CFF" />
      <stop offset="100%" stop-color="#5CD6E8" />
    </linearGradient>
    <linearGradient id="veyro-needle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5CD6E8" />
      <stop offset="100%" stop-color="#8B7CFF" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Squircle with Gradient Border matching VEYRO brand navbar logo -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#08090C" stroke="url(#veyro-border-grad)" stroke-width="3" />

  <!-- Subtle Ambient Glow -->
  <circle cx="32" cy="32" r="16" fill="#5CD6E8" fill-opacity="0.12" />

  <!-- Compass Outer Circle -->
  <circle cx="32" cy="32" r="18" stroke="#5CD6E8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Compass Cardinal Ticks -->
  <line x1="32" y1="10.5" x2="32" y2="13.5" stroke="#8B7CFF" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="50.5" x2="32" y2="53.5" stroke="#8B7CFF" stroke-width="2" stroke-linecap="round" />
  <line x1="10.5" y1="32" x2="13.5" y2="32" stroke="#8B7CFF" stroke-width="2" stroke-linecap="round" />
  <line x1="50.5" y1="32" x2="53.5" y2="32" stroke="#8B7CFF" stroke-width="2" stroke-linecap="round" />

  <!-- Compass Needle Polygon (Direct Lucide Compass Geometry) -->
  <polygon points="40 24 35.5 35.5 24 40 28.5 28.5" fill="url(#veyro-needle-grad)" stroke="#5CD6E8" stroke-width="2" stroke-linejoin="round" />

  <!-- Central Pivot Bead -->
  <circle cx="32" cy="32" r="2.5" fill="#08090C" stroke="#5CD6E8" stroke-width="1.5" />
</svg>
